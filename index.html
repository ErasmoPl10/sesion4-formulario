<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro al Webinar</title>
  
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
   
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">

    <div class="container py-5">
        <div class="row justify-content-center">
            
            <div class="col-md-8 col-lg-6">
                <div class="card shadow-sm">
                    <div class="card-body p-4">
                        <h2 class="text-center mb-4">Registro al Webinar</h2>
                        
                        
                        <form novalidate>
                            
                            <div class="mb-3">
                                <label for="nombre" class="form-label">Nombre completo *</label>
                                <input type="text" class="form-control" id="nombre" placeholder="Ej. Juan Pérez" required>
                            </div>

                           
                            <div class="mb-3">
                                <label for="correo" class="form-label">Correo electrónico *</label>
                                <input type="email" class="form-control" id="correo" placeholder="correo@ejemplo.com" required>
                            </div>

                           
                            <div class="mb-3">
                                <label for="edad" class="form-label">Edad *</label>
                                <input type="number" class="form-control" id="edad" min="16" max="99" placeholder="Entre 16 y 99 años" required>
                            </div>

                            
                            <div class="mb-3">
                                <label for="fechaNacimiento" class="form-label">Fecha de nacimiento</label>
                                <input type="date" class="form-control" id="fechaNacimiento">
                            </div>

                            <!-- 5. País -->
                            <div class="mb-3">
                                <label for="pais" class="form-label">País *</label>
                                <select class="form-select" id="pais" required>
                                    <option value="" selected disabled>Seleccione su país</option>
                                    <option value="PE">Perú</option>
                                    <option value="MX">Brasil</option>
                                    <option value="CO">Paraguay</option>
                                    <option value="AR">Argentina</option>
                                </select>
                            </div>

                       
                            <div class="mb-3">
                                <label class="form-label d-block">Tipo de participación *</label>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="radio" name="tipoParticipacion" id="presencial" value="Presencial" required>
                                    <label class="form-check-label" for="presencial">Presencial</label>
                                </div>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="radio" name="tipoParticipacion" id="virtual" value="Virtual" required>
                                    <label class="form-check-label" for="virtual">Virtual</label>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="comentarios" class="form-label">Comentarios</label>
                                <textarea class="form-control" id="comentarios" rows="3" placeholder="Escribe tus dudas o comentarios (opcional)"></textarea>
                            </div>

                            
                            <div class="mb-3 form-check">
                                <input type="checkbox" class="form-check-input" id="terminos" required>
                                <label class="form-check-label" for="terminos">Acepto los términos y condiciones *</label>
                            </div>

                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary">Enviar Registro</button>
                            </div>

                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle CDN -->
    <script 
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>
</body>
</html>
